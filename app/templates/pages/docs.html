{% extends 'base.html' %}

{% block content %}
  <div class="card">
    <h1>{{ title }}</h1>
    <ul>
      {% for route in routes %}
        <li>
          <code>{{ route.method }}</code> {{ route.path }}
          {% if route.summary %}
            <div>{{ route.summary }}</div>
          {% endif %}
        </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
