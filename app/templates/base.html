<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
      main {
        max-width: 960px;
        margin: 32px auto;
        padding: 16px;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
      }
      nav {
        background: #0f172a;
        color: white;
        padding: 16px 24px;
      }
      nav a {
        color: white;
        margin-right: 16px;
      }
      code {
        background: #e2e8f0;
        padding: 2px 6px;
        border-radius: 6px;
      }
      ul {
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    {% include 'partials/header.html' %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% include 'partials/footer.html' %}
  </body>
</html>
